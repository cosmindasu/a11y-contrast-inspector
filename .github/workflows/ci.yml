name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']

# A new push supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # One job on purpose: typecheck and tests together take seconds, and every
    # job is billed rounded up to a whole minute.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, so this also proves the
      # expo-share-intent patch still applies to the pinned version.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test -- --ci
